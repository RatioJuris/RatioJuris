<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="title">
  <title id="title">Isrgrajan Gonardiya</title>

  <defs>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="620" y2="0">
      <stop offset="0%" stop-color="#8f6b12"/>
      <stop offset="42%" stop-color="#8f6b12"/>
      <stop offset="50%" stop-color="#e2c35a"/>
      <stop offset="58%" stop-color="#8f6b12"/>
      <stop offset="100%" stop-color="#8f6b12"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-620 0; -620 0; 620 0; 620 0" keyTimes="0; 0.3; 0.75; 1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8902a"/>
      <stop offset="100%" stop-color="#6b4f0a"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <style>
    .serif { font-family: Georgia, "Times New Roman", Times, serif; text-anchor: middle; }
    .given {
      font-size: 20px; letter-spacing: 14px; fill: #1d2540;
      opacity: 0; animation: fade 1.2s ease-out 0.2s forwards;
    }
    .hallmark { font-size: 116px; font-style: italic; }
    .halo  { fill: #8f6b12; opacity: 0; filter: url(#glow); animation: halo 1.4s ease-out 2.2s forwards; }
    .body  { fill: url(#depth); fill-opacity: 0; animation: ink 1s ease-out 2s forwards; }
    .shine { fill: url(#shimmer); opacity: 0; animation: fade 1s ease-out 2.6s forwards; }
    .pen {
      fill: none; stroke: #8f6b12; stroke-width: 1.4;
      stroke-dasharray: 520; stroke-dashoffset: 520;
      animation: draw 2.6s ease-in-out 0.4s forwards, fade-out 0.8s ease-out 2.6s forwards;
    }
    .rule { stroke: #8f6b12; stroke-width: 1; opacity: 0; animation: fade 1.2s ease-out 0.4s forwards; }
    .flourish {
      fill: none; stroke: #8f6b12; stroke-width: 1.6; stroke-linecap: round;
      stroke-dasharray: 260; stroke-dashoffset: 260;
      animation: draw 1.6s ease-in-out 1.8s forwards;
    }
    .gem { fill: #8f6b12; opacity: 0; animation: fade 0.8s ease-out 3s forwards; }
    @keyframes draw     { to { stroke-dashoffset: 0; } }
    @keyframes ink      { to { fill-opacity: 1; } }
    @keyframes fade     { to { opacity: 1; } }
    @keyframes fade-out { to { opacity: 0; } }
    @keyframes halo     { to { opacity: 0.28; } }
  </style>

  <!-- Given name -->
  <path class="rule" d="M140 56 H226 M508 56 H594"/>
  <text class="serif given" x="367" y="63">ISRGRAJAN</text>

  <!-- Hallmark: Gonardiya -->
  <text class="serif hallmark halo"  x="360" y="178">Gonardiya</text>
  <text class="serif hallmark body"  x="360" y="178">Gonardiya</text>
  <text class="serif hallmark shine" x="360" y="178">Gonardiya</text>
  <text class="serif hallmark pen"   x="360" y="178">Gonardiya</text>

  <!-- Twinkling star -->
  <g transform="translate(612 88)">
    <path fill="#e2c35a" d="M0 -14 C1.5 -3 3 -1.5 14 0 C3 1.5 1.5 3 0 14 C-1.5 3 -3 1.5 -14 0 C-3 -1.5 -1.5 -3 0 -14 Z">
      <animateTransform attributeName="transform" type="scale" values="0;0;1;0.35;1;0.35" keyTimes="0;0.45;0.6;0.75;0.88;1" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Flourish with central seal -->
  <path class="flourish" d="M346 222 C 300 238, 250 206, 200 220 C 182 225, 172 232, 160 226"/>
  <path class="flourish" d="M374 222 C 420 238, 470 206, 520 220 C 538 225, 548 232, 560 226"/>
  <path class="gem" d="M360 211 l11 11 l-11 11 l-11 -11 z" fill-opacity="0.25" stroke="#8f6b12" stroke-width="1.2"/>
  <path class="gem" d="M360 217 l5 5 l-5 5 l-5 -5 z"/>
</svg>
