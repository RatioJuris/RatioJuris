<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img" aria-labelledby="title">
  <title id="title">Isrgrajan Gonardiya</title>

  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e7b0"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a8841f"/>
    </linearGradient>
  </defs>

  <style>
    .script {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-style: italic;
      font-size: 82px;
      text-anchor: middle;
      fill: url(#ink);
      fill-opacity: 0;
      stroke: #d4af37;
      stroke-width: 1.2;
      stroke-dasharray: 420;
      stroke-dashoffset: 420;
      animation: write 2.4s ease-in-out forwards, ink 1s ease-out 1.8s forwards;
    }
    .engraved {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 30px;
      letter-spacing: 15px;
      text-anchor: middle;
      fill: #efe7d2;
      fill-opacity: 0.14;
      stroke: #efe7d2;
      stroke-width: 1.3;
      opacity: 0;
      animation: rise 1.2s ease-out 2.4s forwards;
    }
    .swash {
      fill: none;
      stroke: #d4af37;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-dasharray: 700;
      stroke-dashoffset: 700;
      animation: write 1.6s ease-in-out 1.4s forwards;
    }
    .gem { fill: #d4af37; opacity: 0; animation: rise 1s ease-out 2.8s forwards; }
    @keyframes write { to { stroke-dashoffset: 0; } }
    @keyframes ink   { to { fill-opacity: 1; stroke-width: 0.4; } }
    @keyframes rise  { to { opacity: 1; } }
  </style>

  <text class="script" x="320" y="96">Isrgrajan</text>

  <path class="swash" d="M120 128 C 220 110, 300 146, 380 124 S 500 108, 540 120 q 14 4 4 12"/>

  <text class="engraved" x="328" y="186">GONARDIYA</text>

  <path class="gem" d="M110 176 l6 -6 l6 6 l-6 6 z"/>
  <path class="gem" d="M518 176 l6 -6 l6 6 l-6 6 z"/>
</svg>
