<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 450"
     width="100%"
     height="100%"
     role="img"
     aria-labelledby="title desc">

  <title id="title">RatioJuris — The Logic of Law</title>
  <desc id="desc">Animated RatioJuris identity mark cycling through RatioJuris, Isrg Rajan, and Ronav Isrgrajan Narayandas.</desc>

  <defs>
    <!-- Gradients -->
    <linearGradient id="ii-Ratio" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#ff9933"/>
    </linearGradient>

    <linearGradient id="ii-Juris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="ii-Isrg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="ii-Rajan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>

    <linearGradient id="ii-Ronav" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ffa600"/>
    </linearGradient>

    <linearGradient id="ii-Isrgrajan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="ii-Narayandas" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-70%" width="200%" height="240%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Particle Glow Filter -->
    <filter id="particleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="p1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="p2"/>
      <feMerge>
        <feMergeNode in="p2"/>
        <feMergeNode in="p1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .geo-text {
      font-family: "Share Tech Mono", "Courier New", Courier, monospace;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      filter: url(#neonGlow);
    }
    .size-large {
      font-size: 130px;
      letter-spacing: -2px;
    }
    .size-small {
      font-size: 64px;
      letter-spacing: -1px;
    }
    .t-ratio { fill: url(#ii-Ratio); }
    .t-juris { fill: url(#ii-Juris); }
    .t-isrg { fill: url(#ii-Isrg); }
    .t-rajan { fill: url(#ii-Rajan); }
    .t-ronav { fill: url(#ii-Ronav); }
    .t-isrgrajan { fill: url(#ii-Isrgrajan); }
    .t-narayandas { fill: url(#ii-Narayandas); }

    .grid-line {
      stroke: #ffffff;
      stroke-width: 1;
      opacity: 0.05;
    }
  </style>

  <!-- Matrix Grid -->
  <g aria-hidden="true">
    <line class="grid-line" x1="0" y1="225" x2="1200" y2="225"/>
    <line class="grid-line" x1="600" y1="0" x2="600" y2="450"/>
    <circle cx="600" cy="225" r="180" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03"/>
    <circle cx="600" cy="225" r="320" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.02"/>
  </g>

  <!-- Central Stage -->
  <g transform="translate(600, 225)">

    <!-- Card 1: RatioJuris -->
    <text x="0" y="0" class="geo-text size-large" aria-label="RatioJuris">
      <tspan class="t-ratio">Ratio</tspan><tspan class="t-juris">Juris</tspan>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="-1100 0; 0 0; 0 0; 1100 0; 1100 0"
        keyTimes="0; 0.07; 0.26; 0.333; 1"
        dur="6s"
        calcMode="spline"
        keySplines=".25 1 .5 1; 0 0 1 1; .5 0 .75 0; 0 0 1 1"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0; 1; 1; 0; 0"
        keyTimes="0; 0.06; 0.27; 0.333; 1"
        dur="6s"
        repeatCount="indefinite"/>
    </text>

    <!-- Card 2: Isrg Rajan -->
    <text x="0" y="0" class="geo-text size-large" aria-label="Isrg Rajan" opacity="0">
      <tspan class="t-isrg">Isrg</tspan><tspan class="t-rajan"> Rajan</tspan>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="1100 0; 1100 0; 0 0; 0 0; -1100 0; -1100 0"
        keyTimes="0; 0.333; 0.403; 0.593; 0.666; 1"
        dur="6s"
        calcMode="spline"
        keySplines="0 0 1 1; .25 1 .5 1; 0 0 1 1; .5 0 .75 0; 0 0 1 1"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.333; 0.393; 0.603; 0.666; 1"
        dur="6s"
        repeatCount="indefinite"/>
    </text>

    <!-- Card 3: Ronav Isrgrajan Narayandas -->
    <text x="0" y="0" class="geo-text size-small" aria-label="Ronav Isrgrajan Narayandas" opacity="0">
      <tspan class="t-ronav">Ronav </tspan><tspan class="t-isrgrajan">Isrgrajan </tspan><tspan class="t-narayandas">Narayandas</tspan>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="-1100 0; -1100 0; 0 0; 0 0; 1100 0"
        keyTimes="0; 0.666; 0.736; 0.926; 1"
        dur="6s"
        calcMode="spline"
        keySplines="0 0 1 1; .25 1 .5 1; 0 0 1 1; .5 0 .75 0"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0; 0; 1; 1; 0"
        keyTimes="0; 0.666; 0.726; 0.936; 1"
        dur="6s"
        repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Particle Bursts Centered at (600, 225) -->
  <!-- Burst 1 -->
  <g transform="translate(600, 225)" filter="url(#particleGlow)" opacity="0" aria-hidden="true">
    <circle cx="-50" cy="-25" r="8" fill="#ff6600"/>
    <circle cx="60" cy="25" r="6" fill="#10b981"/>
    <rect x="-120" y="5" width="10" height="10" fill="#ff6600" transform="rotate(45 -115 10)"/>
    <rect x="120" y="-45" width="12" height="12" fill="#10b981" transform="rotate(15 126 -39)"/>
    <circle cx="0" cy="-115" r="5" fill="#ff6600"/>
    <circle cx="0" cy="115" r="7" fill="#10b981"/>

    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.32;1" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="0.7; 1.35" dur="1.92s" repeatCount="indefinite"/>
  </g>

  <!-- Burst 2 -->
  <g transform="translate(600, 225)" filter="url(#particleGlow)" opacity="0" aria-hidden="true">
    <circle cx="-80" cy="-55" r="7" fill="#10b981"/>
    <circle cx="80" cy="35" r="9" fill="#ec4899"/>
    <rect x="30" y="85" width="11" height="11" fill="#10b981" transform="rotate(30 35.5 90.5)"/>
    <rect x="-60" y="-95" width="9" height="9" fill="#ec4899" transform="rotate(60 -55.5 -90.5)"/>
    <circle cx="-140" cy="-5" r="6" fill="#10b981"/>
    <circle cx="140" cy="-15" r="5" fill="#ec4899"/>

    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.383;0.55;0.65;1" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="0.7; 1.35" begin="2s" dur="1.92s" repeatCount="indefinite"/>
  </g>

  <!-- Burst 3 -->
  <g transform="translate(600, 225)" filter="url(#particleGlow)" opacity="0" aria-hidden="true">
    <circle cx="-40" cy="15" r="6" fill="#ec4899"/>
    <circle cx="40" cy="-45" r="8" fill="#ff6600"/>
    <rect x="70" y="65" width="12" height="12" fill="#ec4899" transform="rotate(20 76 71)"/>
    <rect x="-90" y="-75" width="8" height="8" fill="#ff6600" transform="rotate(75 -86 -71)"/>
    <circle cx="0" cy="-145" r="7" fill="#ec4899"/>
    <circle cx="0" cy="145" r="6" fill="#ff6600"/>

    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.666;0.716;0.88;0.98" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="0.7; 1.35" begin="4s" dur="1.92s" repeatCount="indefinite"/>
  </g>
</svg>
