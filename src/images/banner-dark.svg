<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">RatioJuris â€” The Logic of Law</title>
  <desc id="desc">Classical banner with balanced scales of justice, flanking columns, and rotating Latin maxims.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e7b0"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a8841f"/>
    </linearGradient>

    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="44%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f6e7b0"/>
      <stop offset="56%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#d4af37"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-700 0; 700 0; 700 0" keyTimes="0; 0.55; 1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .line  { stroke: #d4af37; fill: none; }
    .fill  { fill: #d4af37; }
    .title { font-family: Georgia, "Times New Roman", Times, serif; font-size: 66px; letter-spacing: 16px; text-anchor: middle; fill: url(#shimmer); }
    .sub   { font-family: Georgia, "Times New Roman", Times, serif; font-size: 17px; letter-spacing: 9px; text-anchor: middle; fill: #efe7d2; }
    .motto { font-family: Georgia, "Times New Roman", Times, serif; font-size: 19px; font-style: italic; text-anchor: middle; fill: #efe7d2; }
    .trans { font-family: Georgia, "Times New Roman", Times, serif; font-size: 13px; letter-spacing: 4px; text-anchor: middle; fill: #8e97ab; }
  </style>

  <!-- Field and frame -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect x="14" y="14" width="1172" height="332" rx="4" class="line" stroke-width="1" opacity="0.55"/>
  <rect x="22" y="22" width="1156" height="316" rx="2" class="line" stroke-width="0.6" opacity="0.3"/>
  <g class="fill" opacity="0.8">
    <path d="M14 180 l6 -6 l6 6 l-6 6 z"/>
    <path d="M1174 180 l6 -6 l6 6 l-6 6 z"/>
    <path d="M600 8 l6 6 l-6 6 l-6 -6 z"/>
    <path d="M600 340 l6 6 l-6 6 l-6 -6 z"/>
  </g>

  <!-- Columns -->
  <g id="column" class="line" stroke-width="1.4" opacity="0.5" transform="translate(140 0)">
    <path d="M-40 78 h80 M-36 84 h72"/>
    <rect x="-32" y="88" width="64" height="9"/>
    <rect x="-26" y="97" width="52" height="8"/>
    <path d="M-22 105 V286 M22 105 V286 M-11 109 V282 M0 109 V282 M11 109 V282"/>
    <rect x="-28" y="286" width="56" height="7"/>
    <rect x="-36" y="293" width="72" height="9"/>
  </g>
  <use href="#column" transform="translate(920 0)"/>

  <!-- Scales of justice -->
  <g transform="translate(600 0)">
    <path class="line" stroke-width="2" d="M0 44 V132"/>
    <path class="fill" d="M-26 138 h52 l-8 -6 h-36 z"/>
    <circle class="fill" cx="0" cy="40" r="4.5"/>

    <g>
      <path class="line" stroke-width="2.2" stroke-linecap="round" d="M-64 56 H64"/>
      <circle class="fill" cx="0" cy="56" r="3"/>
      <animateTransform attributeName="transform" type="rotate" values="-4 0 56; 4 0 56; -4 0 56"
        keyTimes="0; 0.5; 1" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1" dur="6s" repeatCount="indefinite"/>
    </g>

    <g>
      <path class="line" stroke-width="1" d="M-64 56 L-84 96 M-64 56 L-44 96"/>
      <path class="fill" d="M-88 96 H-40 Q-64 112 -88 96 z"/>
      <animateTransform attributeName="transform" type="translate" values="0 4.5; 0 -4.5; 0 4.5"
        keyTimes="0; 0.5; 1" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <path class="line" stroke-width="1" d="M64 56 L44 96 M64 56 L84 96"/>
      <path class="fill" d="M40 96 H88 Q64 112 40 96 z"/>
      <animateTransform attributeName="transform" type="translate" values="0 -4.5; 0 4.5; 0 -4.5"
        keyTimes="0; 0.5; 1" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Title -->
  <text class="title" x="608" y="210">RATIOJURIS
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
  </text>

  <g>
    <path class="line" stroke-width="1" opacity="0.7" d="M330 241 H432 M772 241 H874"/>
    <text class="sub" x="604" y="247">THE LOGIC OF LAW</text>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2s" fill="freeze"/>
  </g>

  <!-- Rotating maxims -->
  <g opacity="0">
    <text class="motto" x="600" y="290">Ratio ante regulam</text>
    <text class="trans" x="600" y="312">REASON BEFORE RULE</text>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.2;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <text class="motto" x="600" y="290">Structura ante scalam</text>
    <text class="trans" x="600" y="312">STRUCTURE BEFORE SCALE</text>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.2;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <text class="motto" x="600" y="290">Justitia per systema</text>
    <text class="trans" x="600" y="312">JUSTICE THROUGH SYSTEMS</text>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.2;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <text class="motto" x="600" y="290">Lex per logicam</text>
    <text class="trans" x="600" y="312">LAW THROUGH LOGIC</text>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.2;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/>
  </g>
</svg>
