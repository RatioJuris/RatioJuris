name: Update README snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            src/cards/snake-dark.svg?color_snake=#efe7d2&color_dots=#161f35,#4a3c14,#7a5c12,#b8902a,#f6e7b0
            src/cards/snake-light.svg?color_snake=#1d2540&color_dots=#ebe5d6,#e8d79a,#d4af37,#a8841f,#6b4f0a

      - name: Commit snake
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src/cards/*.svg
          git commit -m "Update README snake" || exit 0
          git push
